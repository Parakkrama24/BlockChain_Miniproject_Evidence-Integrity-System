spring:
  datasource:
    url: jdbc:h2:file:./data/evidence
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

evidence:
  blockchain:
    rpc-url: ${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
    contract-address: ${EVIDENCE_REGISTRY_ADDRESS:}

server:
  port: ${PORT:8080}