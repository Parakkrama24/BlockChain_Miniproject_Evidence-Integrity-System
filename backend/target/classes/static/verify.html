<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify Evidence</title>
    <style>
        :root { color-scheme: light; font-family: Georgia, serif; --ink: #1d252c; --paper: #f5f1e9; --line: #c9c1b5; --green: #176b4d; --red: #a52c2c; }
        body { margin: 0; color: var(--ink); background: radial-gradient(circle at top right, #fff 0, var(--paper) 48%, #e7dfd2 100%); min-height: 100vh; }
        main { max-width: 920px; margin: 0 auto; padding: 7rem 1.5rem 4rem; }
        .eyebrow { letter-spacing: .16em; text-transform: uppercase; font: 700 .72rem Arial, sans-serif; color: #756e64; }
        h1 { font-size: clamp(2.5rem, 7vw, 5.5rem); line-height: .95; margin: .75rem 0 1rem; max-width: 680px; }
        .intro { font: 1.1rem/1.5 Arial, sans-serif; max-width: 600px; color: #5d625f; }
        form { display: grid; grid-template-columns: 160px 1fr auto; gap: 1rem; align-items: end; margin: 3rem 0 2rem; padding: 1.25rem 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
        label { display: grid; gap: .45rem; font: 700 .78rem Arial, sans-serif; text-transform: uppercase; letter-spacing: .08em; }
        input { box-sizing: border-box; width: 100%; border: 1px solid var(--line); background: #fffdf9; padding: .85rem; font: 1rem Arial, sans-serif; }
        button { border: 0; padding: .9rem 1.4rem; background: var(--ink); color: white; font: 700 .85rem Arial, sans-serif; cursor: pointer; }
        button:disabled { opacity: .5; cursor: wait; }
        #result { display: none; }
        .banner { padding: 1.2rem 1.4rem; color: white; font: 700 1.5rem Arial, sans-serif; letter-spacing: .08em; }
        .verified { background: var(--green); } .tampered { background: var(--red); }
        .hashes { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
        .hash { border-top: 4px solid var(--line); padding: 1rem 0; } .hash strong { display: block; font: 700 .75rem Arial, sans-serif; text-transform: uppercase; letter-spacing: .08em; margin-bottom: .6rem; }
        code { overflow-wrap: anywhere; font: .95rem/1.45 Consolas, monospace; }
        #error { color: var(--red); font: 1rem Arial, sans-serif; margin-top: 1rem; }
        @media (max-width: 680px) { main { padding-top: 3rem; } form, .hashes { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<main>
    <div class="eyebrow">Evidence Integrity System / Read Path</div>
    <h1>Verify evidence.</h1>
    <p class="intro">Check the current file against the SHA-256 hash permanently recorded on the blockchain.</p>
    <form id="verify-form">
        <label>Evidence ID<input id="evidence-id" type="number" min="0" required></label>
        <label>Current file<input id="file" type="file" required></label>
        <button id="submit" type="submit">Check hash</button>
    </form>
    <div id="error" role="alert"></div>
    <section id="result" aria-live="polite">
        <div id="banner" class="banner"></div>
        <div class="hashes">
            <div class="hash"><strong>Stored on chain</strong><code id="stored-hash"></code></div>
            <div class="hash"><strong>Computed from upload</strong><code id="computed-hash"></code></div>
        </div>
    </section>
</main>
<script>
    const form = document.querySelector('#verify-form');
    const submit = document.querySelector('#submit');
    const error = document.querySelector('#error');
    form.addEventListener('submit', async (event) => {
        event.preventDefault(); error.textContent = ''; submit.disabled = true;
        const data = new FormData(); data.append('file', document.querySelector('#file').files[0]);
        try {
            const id = document.querySelector('#evidence-id').value;
            const response = await fetch(`/api/evidence/${id}/verify`, { method: 'POST', body: data });
            if (!response.ok) throw new Error(await response.text());
            const result = await response.json();
            document.querySelector('#result').style.display = 'block';
            const banner = document.querySelector('#banner');
            banner.textContent = result.verified ? 'VERIFIED' : 'TAMPERED';
            banner.className = `banner ${result.verified ? 'verified' : 'tampered'}`;
            document.querySelector('#stored-hash').textContent = result.storedHash;
            document.querySelector('#computed-hash').textContent = result.computedHash;
        } catch (exception) { error.textContent = exception.message || 'Verification failed.'; }
        finally { submit.disabled = false; }
    });
</script>
</body>
</html>
